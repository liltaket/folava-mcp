[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "folava-mcp"
version = "0.1.4"
description = "A read-only Canvas LMS connection for your agents."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Folava MCP contributors" }]
keywords = ["canvas-lms", "mcp", "education", "agents", "codex"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Education",
]
dependencies = ["mcp==2.3.0", "httpx==0.28.1", "keyring>=25.7,<26", "typer>=0.27,<0.28"]

[project.scripts]
folava-mcp = "folava_mcp.cli:app"

[project.urls]
Homepage = "https://liltaket.github.io/folava-mcp/"
Documentation = "https://liltaket.github.io/folava-mcp/docs/getting-started/"
Issues = "https://github.com/liltaket/folava-mcp/issues"

[dependency-groups]
dev = ["pytest>=9.2,<10", "pytest-asyncio>=1.4,<2", "ruff>=0.17,<0.18", "build>=1.6,<2", "hatchling>=1.27,<2", "markdown-it-py>=4.2,<5"]
web = ["playwright==1.64.1"]

[tool.hatch.build.targets.wheel]
packages = ["src/folava_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
